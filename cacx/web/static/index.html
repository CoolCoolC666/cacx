<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cacx · 网信办语料检索</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --fg:#e6e8ee; --dim:#9aa3b2; --acc:#4c8dff; --acc2:#7ab8ff;
    --warn:#ffb454; --err:#ff6b6b; --ok:#5ddc9a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 -apple-system,"Microsoft YaHei",Segoe UI,sans-serif}
  header{padding:14px 22px;border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.3px}
  header .stat{color:var(--dim);font-size:12.5px}
  header .stat b{color:var(--acc2);font-weight:600}
  main{padding:18px 22px;max-width:1400px;margin:0 auto}
  .searchbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,select,button{background:var(--panel2);color:var(--fg);
    border:1px solid var(--line);border-radius:6px;padding:7px 11px;font-size:13.5px;
    outline:none;font-family:inherit}
  input:focus,select:focus{border-color:var(--acc)}
  input#q{flex:1;min-width:260px}
  button{cursor:pointer}
  button:hover{border-color:var(--acc)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .filters label{color:var(--dim);font-size:12.5px;display:flex;
                 align-items:center;gap:5px}
  .meta{color:var(--dim);font-size:12.5px;margin:14px 0 8px;
        display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .pill{background:var(--panel2);border:1px solid var(--line);
        padding:2px 8px;border-radius:10px;font-size:11.5px}
  .pill.fts{color:var(--ok);border-color:#2c5a45}
  .pill.like{color:var(--warn);border-color:#5a4527}
  .list{display:flex;flex-direction:column;gap:8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
        padding:12px 14px;cursor:pointer;transition:.12s}
  .card:hover{border-color:var(--acc);background:var(--panel2)}
  .card .t{font-size:14.5px;font-weight:500;margin-bottom:5px}
  .card .m{color:var(--dim);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
  .tag{background:#232936;border-radius:4px;padding:1px 7px;font-size:11.5px}
  .empty{padding:60px;text-align:center;color:var(--dim)}
  /* 详情抽屉 */
  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40}
  .drawer.on{display:block}
  .panel{position:absolute;right:0;top:0;bottom:0;width:min(760px,94vw);
         background:var(--bg);border-left:1px solid var(--line);
         overflow:auto;padding:20px 24px}
  .panel h2{font-size:18px;margin:0 0 10px;line-height:1.45}
  .kv{color:var(--dim);font-size:12.5px;display:flex;gap:14px;
      flex-wrap:wrap;margin-bottom:14px;padding-bottom:12px;
      border-bottom:1px solid var(--line)}
  .kv a{color:var(--acc2)}
  .body{white-space:pre-wrap;font-size:14px;line-height:1.85;word-break:break-word}
  .close{position:absolute;right:16px;top:16px;font-size:20px;
         background:none;border:none;color:var(--dim);cursor:pointer}
  .aibox{background:var(--panel);border:1px solid var(--line);border-radius:8px;
         padding:12px 14px;margin:14px 0}
  .aibox h3{margin:0 0 8px;font-size:13px;color:var(--acc2)}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;
         margin:20px 0 40px}
  code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>cacx <span style="color:var(--dim);font-weight:400">网信办语料检索</span></h1>
  <div class="stat" id="stat">加载中…</div>
</header>

<main>
  <div class="searchbar">
    <input id="q" placeholder="输入关键词，支持空格分词（≥3字走 FTS5 索引，1~2字自动降级为扫描）">
    <select id="site"><option value="">全部站点</option></select>
    <select id="column"><option value="">全部栏目</option></select>
    <select id="year"><option value="">全部年份</option></select>
    <select id="sort">
      <option value="date_desc">按日期 ↓</option>
      <option value="date_asc">按日期 ↑</option>
      <option value="chars_desc">按字数 ↓</option>
      <option value="chars_asc">按字数 ↑</option>
    </select>
    <button class="primary" onclick="go(1)">检索</button>
  </div>
  <div class="filters">
    <label>日期 <input type="date" id="date_from" style="width:150px">
      → <input type="date" id="date_to" style="width:150px"></label>
    <label>最少字数 <input type="number" id="min_chars" style="width:100px" placeholder="0"></label>
    <label><input type="checkbox" id="skip_empty" checked> 隐藏空正文</label>
    <button onclick="reset()">重置</button>
  </div>

  <div class="meta" id="meta"></div>
  <div class="list" id="list"></div>
  <div class="pager" id="pager"></div>
</main>

<div class="drawer" id="drawer" onclick="if(event.target===this)closeDrawer()">
  <div class="panel">
    <button class="close" onclick="closeDrawer()">×</button>
    <div id="detail"></div>
  </div>
</div>

<script>
let PAGE = 1, TOTAL = 0, PAGES = 0;

const $ = id => document.getElementById(id);

function params(){
  const p = new URLSearchParams();
  const add=(k,v)=>{ if(v) p.set(k,v); };
  add('q', $('q').value.trim());
  add('site', $('site').value);
  add('column', $('column').value);
  add('year', $('year').value);
  add('sort', $('sort').value);
  add('date_from', $('date_from').value);
  add('date_to', $('date_to').value);
  add('min_chars', $('min_chars').value);
  if($('skip_empty').checked) p.set('skip_empty','true');
  return p;
}

async function loadFacets(){
  const f = await (await fetch('/api/facets')).json();
  $('stat').innerHTML = `<b>${f.total.toLocaleString()}</b> 篇文章 · ` +
    `<b>${(f.chars/10000).toFixed(0)}</b> 万字 · ${f.days} 天 · ` +
    `${f.external} 条站外`;
  for(const s of f.sites){
    const o = document.createElement('option');
    o.value = s.site; o.textContent = s.site_name || s.site;
    $('site').appendChild(o);
  }
  for(const c of f.columns){
    const o = document.createElement('option');
    o.value = c.column_name; o.textContent = `${c.site==='cac'?'国':'浙'}·${c.column_name} (${c.n})`;
    $('column').appendChild(o);
  }
  for(const y of f.years){
    const o = document.createElement('option');
    o.value = y.year; o.textContent = `${y.year} (${y.n})`;
    $('year').appendChild(o);
  }
}

async function go(page){
  PAGE = page;
  const p = params(); p.set('page', page);
  const r = await (await fetch('/api/search?'+p)).json();
  TOTAL = r.total; PAGES = r.pages;
  const modeTxt = r.mode==='fts' ? '<span class="pill fts">FTS5 索引</span>'
              : r.mode==='like' ? '<span class="pill like">LIKE 扫描（词过短）</span>'
              : '<span class="pill">浏览</span>';
  $('meta').innerHTML = `命中 <b>${r.total.toLocaleString()}</b> 条 · ${modeTxt} · ${r.took_ms}ms`;
  const L = $('list');
  if(!r.items.length){ L.innerHTML = '<div class="empty">没有命中。换个词，或放宽筛选条件。</div>'; }
  else L.innerHTML = r.items.map(it=>`
    <div class="card" onclick="detail(${it.id})">
      <div class="t">${esc(it.title)}</div>
      <div class="m">
        <span class="tag">${it.site_name||it.site}</span>
        <span class="tag">${esc(it.column_name||'')}</span>
        <span>${(it.pub_date||'').slice(0,10)}</span>
        <span>${(it.chars||0).toLocaleString()} 字</span>
        ${it.source_text?`<span>来源 ${esc(it.source_text)}</span>`:''}
      </div>
    </div>`).join('');
  $('pager').innerHTML = PAGES>1 ? `
    <button ${PAGE<=1?'disabled':''} onclick="go(${PAGE-1})">上一页</button>
    <span style="color:var(--dim)">${PAGE} / ${PAGES}</span>
    <button ${PAGE>=PAGES?'disabled':''} onclick="go(${PAGE+1})">下一页</button>` : '';
}

async function detail(id){
  const a = await (await fetch('/api/article/'+id)).json();
  const ai = a.ai && a.ai.summarize;
  $('detail').innerHTML = `
    <h2>${esc(a.title)}</h2>
    <div class="kv">
      <span>${a.site_name||a.site} · ${esc(a.column_name||'')}</span>
      <span>${a.pub_date||''}</span>
      <span>${(a.chars||0).toLocaleString()} 字</span>
      ${a.source_text?`<span>来源 ${esc(a.source_text)}</span>`:''}
    </div>
    ${a.content_empty ? '<div class="aibox"><h3>注意</h3>本文正文在源站即为空（转载占位条目）。</div>' : ''}
    <div style="margin-bottom:14px">
      <a href="/open?id=${a.id}" target="_blank" rel="noopener"
         style="display:inline-block;background:var(--acc);color:#fff;
                padding:7px 14px;border-radius:6px;text-decoration:none;font-size:13.5px">
         ↗ 跳转原文</a>
      <a href="${esc(a.url)}" target="_blank" rel="noopener"
         style="color:var(--dim);margin-left:12px;font-size:12.5px">直接打开</a>
    </div>
    ${ai ? `<div class="aibox"><h3>AI 摘要</h3>
        <div>${esc(ai.summary||'')}</div>
        ${(ai.tags||[]).length?`<div style="margin-top:7px">${
          ai.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join(' ')}</div>`:''}
      </div>` : ''}
    <div class="body">${esc(a.content_text || '（无正文）')}</div>`;
  $('drawer').classList.add('on');
}

function closeDrawer(){ $('drawer').classList.remove('on'); }
function reset(){
  ['q','date_from','date_to','min_chars'].forEach(id=>$(id).value='');
  ['site','column','year'].forEach(id=>$(id).value='');
  $('skip_empty').checked = true;
  go(1);
}
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

$('q').addEventListener('keydown', e=>{ if(e.key==='Enter') go(1); });
loadFacets().then(()=>go(1));
</script>
</body>
</html>
